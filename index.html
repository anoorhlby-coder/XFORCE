<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>XFORCE</title><style>body{background:#000;color:#fff;text-align:center}h1{color:#ff7a00;font-size:46px;text-shadow:0 0 15px #ff7a00}button{background:#ff7a00;color:#fff;padding:12px;width:100%;border:0;border-radius:12px;box-shadow:0 0 15px #ff7a00}input,select{width:90%;padding:12px;margin:6px;background:#222;color:#fff;border:1px solid #ff7a00;border-radius:10px}.card{border:1px solid #ff7a00;border-radius:15px;padding:12px;margin:10px}</style></head><body><div id="lock" style="padding:40px"><h1>XFORCE</h1><input id="pw" type="password" placeholder="كلمة السر"><button onclick="checkPw()">دخول</button></div><div id="app" style="display:none"><h1>XFORCE</h1><div class="card"><div id="c"></div><div id="tot" style="font-size:22px;color:#0f0"></div></div><div class="card"><b>💰 إدارة المصاري لحالها</b><select id="sel"></select><input id="amt" type="number" placeholder="المبلغ $"><button style="background:#00c853" onclick="moneyAdd()">+ إضافة مصاري</button><button style="background:#d50000" onclick="moneyOut()">- تخريج مصاري</button></div><div class="card"><input id="n" placeholder="اسم المشترك"><input id="m" type="number" placeholder="الرصيد $"><button onclick="a()">+ إضافة مشترك - 30 يوم</button></div><div id="l"></div>
<div class="card"><button onclick="exp()">📥 تصدير نسخة احتياطية</button><input type="file" id="f" style="display:none" onchange="imp(event)"><button style="background:#222;box-shadow:none" onclick="document.getElementById('f').click()">📤 استيراد نسخة احتياطية</button></div></div><script>let s=[];try{s=JSON.parse(localStorage.getItem('xforce_members_v3')||'[]')}catch(e){}function checkPw(){if(document.getElementById('pw').value=='0001'){document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';r()}else{alert('كلمة السر غلط')}}function save(){localStorage.setItem('xforce_members_v3',JSON.stringify(s))}function r(){document.getElementById('c').textContent=s.length+' مشترك';let t=0;s.forEach(x=>t+=Number(x.money||0));document.getElementById('tot').textContent='الرصيد الكلي: '+t+'$';document.get
function a(){let n=document.getElementById('n').value;if(!n)return;let d=new Date();d.setDate(d.getDate()+30);s.push({name:n,money:Number(document.getElementById('m').value||0),end:d.toISOString().slice(0,10)});save();r()}function moneyAdd(){let i=document.getElementById('sel').value,v=Number(document.getElementById('amt').value||0);if(v==0)return;s[i].money+=v;save();r();alert('تمت الإضافة ✅')}function moneyOut(){let i=document.getElementById('sel').value,v=Number(document.getElementById('amt').value||0);if(v==0)return;s[i].money-=v;save();r();alert('تم التخريج ✅')}function renew(i){let d=new Date(s[i].end);d.setDate(d.getDate()+30);s[i].end=d.toISOString().slice(0,10);save();r()}function d(i){if(confirm('حذف؟')){s.splice(i,1);save();r()}}function exp(){let b=new Blob([JSON.stringify(s)]);let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xforce-backup.json';a.click()}function imp(e){let f=e.target.files[0];let rd=new FileReader();rd.onload=()=>{s=JSON.parse(rd.result);save();r()};rd.readAsText(f)}</script></body></html>
