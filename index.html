<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XFORCE</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff;color:#111;text-align:center;padding-bottom:30px}
.logo{font-size:55px;font-weight:900;padding-top:20px}
.logo span{color:#ff6a00}
.logo b{color:#111}
.card{background:#fff;border:2px solid #ff6a00;border-radius:20px;padding:20px;margin:15px;box-shadow:0 5px 20px #ff6a0033}
.balance{font-size:38px;font-weight:900}
input,select{width:90%;padding:13px;border:2px solid #eee;border-radius:12px;font-size:17px;text-align:center;margin:6px 0;outline:none}
input:focus{border-color:#ff6a00}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:17px;font-weight:800;margin-top:8px}
.add{background:#ff6a00;color:#fff}
.out{background:#111;color:#fff}
.member{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px;margin:10px 15px;text-align:right;box-shadow:0 2px 10px #00000011}
.member b{font-size:19px}
.days{color:#ff6a00;font-weight:800}
.small-btn{padding:8px 14px;border:none;border-radius:10px;font-weight:800;margin-left:5px;margin-top:8px}
.renew{background:#ff6a00;color:#fff}
.cancel{background:#111;color:#fff}
.hist{text-align:right;padding:0 20px}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
.plus{color:green;font-weight:800}.minus{color:red;font-weight:800}
</style>
</head>
<body>
<div class="logo"><span>X</span><b>FORCE</b></div>

<div class="card">
<div>رصيدك الحالي</div>
<div class="balance"><span id="bal">0</span> <small>ل.س</small></div>
<input id="amount" type="number" placeholder="اكتب المبلغ هون">
<button class="btn add" onclick="addMoney()">+ إضافة مبلغ</button>
<button class="btn out" onclick="outMoney()">- تخريج مبلغ</button>
</div>

<div class="card">
<h3 style="margin:0">👥 الأعضاء: <span id="count">0</span> شخص</h3>
<input id="mName" placeholder="اسم العضو">
<select id="mDays">
<option value="30">اشتراك 30 يوم</option>
<option value="15">اشتراك 15 يوم</option>
<option value="7">اشتراك 7 أيام</option>
<option value="90">اشتراك 90 يوم</option>
</select>
<button class="btn add" onclick="addMember()">+ إضافة عضو</button>
</div>

<div id="members"></div>

<div class="hist"><h3>آخر الحركات</h3><div id="list">ما في حركات لسا</div></div>

<script>
let bal=Number(localStorage.getItem('x_bal')||0);
let hist=JSON.parse(localStorage.getItem('x_hist')||'[]');
let members=JSON.parse(localStorage.getItem('x_members')||'[]');
function save(){
localStorage.setItem('x_bal',bal);
localStorage.setItem('x_hist',JSON.stringify(hist));
localStorage.setItem('x_members',JSON.stringify(members));
render();
}
function render(){
document.getElementById('bal').innerText=bal.toLocaleString();
document.getElementById('count').innerText=members.length;
let l=document.getElementById('list');
l.innerHTML=hist.length?hist.slice().reverse().map(h=>`<div class="item"><span>${h.type}</span><b class="${h.type=='إضافة'?'plus':'minus'}">${h.type=='إضافة'?'+':'-'} ${h.amt}</b></div>`).join(''):'ما في حركات لسا';
let m=document.getElementById('members');
if(!members.length){m.innerHTML='<p>ما في أعضاء لسا</p>';return}
let now=Date.now();
m.innerHTML=members.map((x,i)=>{
let left=Math.ceil((x.end-now)/86400000);
let txt=left>0?`باقي ${left} يوم`:`خلص اشتراكو!`;
let col=left<=3?'red':'#ff6a00';
return `<div class="member"><b>${x.name}</b><br><span>يخلص بـ: ${new Date(x.end).toLocaleDateString('ar-SY')}</span><br><span class="days" style="color:${col}">${txt}</span><br>
<button class="small-btn renew" onclick="renew(${i})">🔄 تجديد +30 يوم</button>
<button class="small-btn cancel" onclick="delMember(${i})">❌ الغاء الاشتراك</button></div>`
}).join('');
}
function addMoney(){let v=Number(document.getElementById('amount').value);if(!v)return alert('اكتب المبلغ');bal+=v;hist.push({type:'إضافة',amt:v});save();document.getElementById('amount').value=''}
function outMoney(){let v=Number(document.getElementById('amount').value);if(!v)return alert('اكتب المبلغ');if(v>bal)return alert('رصيدك ما بيكفي');bal-=v;hist.push({type:'تخريج',amt:v});save();document.getElementById('amount').value=''}
function addMember(){
let n=document.getElementById('mName').value.trim();
let d=Number(document.getElementById('mDays').value);
if(!n)return alert('اكتب اسم العضو');
members.push({name:n,end:Date.now()+d*86400000});
document.getElementById('mName').value='';save();
}
function renew(i){members[i].end+=30*86400000;save()}
function delMember(i){if(confirm('متأكد بدك تلغي اشتراك '+members[i].name+' ؟')){members.splice(i,1);save()}}
render();
</script>
</body>
</html>
