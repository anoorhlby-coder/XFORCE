<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XFORCE GYM</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:15px}
h1{color:#ff6a00;font-size:42px;margin:5px}
.card{background:#111;border:1px solid #333;border-radius:15px;padding:15px;margin:12px 0}
input{width:92%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#ff6a00;color:#fff;font-size:17px;font-weight:bold;margin:6px 0}
button.gray{background:#333}
.member{background:#1a1a1a;border-radius:10px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
#status{color:#ffb400;font-size:14px}
</style>
</head>
<body>
<h1>XFORCE</h1><div>GYM • MEMBERSHIP • APP</div>
<div class="card">
<div id="count">0 مشترك</div>
<input id="name" placeholder="اسم المشترك">
<input id="money" type="number" placeholder="الرصيد بالدولار $">
<button onclick="addMember()">+ إضافة مشترك - 30 يوم</button>
<div id="status">وضع محلي - جاهز ✅</div>
</div>
<div id="list"></div>
<div class="card">
<b>☁️ ربط السحابة (اختياري)</b>
<input id="token" placeholder="الصق التوكن هنا" type="password">
<button onclick="saveToken()">حفظ و اتصال</button>
<button class="gray" onclick="clearToken()">حذف التوكن</button>
<button class="gray" onclick="exportData()">📥 تصدير نسخة احتياطية</button>
<input type="file" id="fileInput" style="display:none" onchange="importData(event)">
<button class="gray" onclick="document.getElementById('fileInput').click()">📤 استيراد نسخة احتياطية</button>
</div>
<script>
let members = JSON.parse(localStorage.getItem('xforce_members')||'[]');
let token = localStorage.getItem('xforce_token')||'';
document.getElementById('token').value = token;
function saveLocal(){ localStorage.setItem('xforce_members', JSON.stringify(members)); }
function render(){
  document.getElementById('count').textContent = members.length + ' مشترك';
  document.getElementById('list').innerHTML = members.map((m,i)=>`<div class="member"><span><b>${m.name}</b><br>💰 ${m.money}$ - ينتهي ${m.end}</span><button style="width:auto;background:#c00" onclick="delMember(${i})">حذف</button></div>`).join('') || '<p>لا يوجد مشتركين</p>';
}
function addMember(){
  let n=document.getElementById('name').value.trim();
  let mo=document.getElementById('money').value||0;
  if(!n){alert('اكتب الاسم');return;}
  let d=new Date(); d.setDate(d.getDate()+30);
  members.push({name:n, money:mo, end:d.toISOString().slice(0,10)});
  saveLocal(); render(); syncCloud();
  document.getElementById('name').value=''; document.getElementById('money').value='';
}
function delMember(i){ if(confirm('حذف؟')){ members.splice(i,1); saveLocal(); render(); syncCloud(); } }
function setStatus(t){ document.getElementById('status').textContent=t; }
function saveToken(){
  token=document.getElementById('token').value.trim();
  localStorage.setItem('xforce_token', token);
  setStatus('تم حفظ التوكن ✅ - جاري تجربة الاتصال...');
  // لا ننتظر السحابة، الواجهة تضل شغالة
  syncCloud();
  setTimeout(()=>{ if(document.getElementById('status').textContent.includes('جاري')) setStatus('تم الحفظ محلياً ✅ - السحابة اختيارية'); },3000);
}
function clearToken(){
  token=''; localStorage.removeItem('xforce_token');
  document.getElementById('token').value='';
  setStatus('تم حذف التوكن ✅ - وضع محلي');
}
async function syncCloud(){
  if(!token) return;
  setStatus('☁️ جاري المزامنة...');
  try{
    let c=new AbortController(); setTimeout(()=>c.abort(),4000);
    let r=await fetch('https://api.github.com/repos/anoorhlby-coder/XFORCE/contents/data.json',{headers:{Authorization:'Bearer '+token}, signal:c.signal});
    let sha=null, cloud=[];
    if(r.ok){ let j=await r.json(); sha=j.sha; try{ cloud=JSON.parse(atob(j.content.replace(/\n/g,''))); }catch(e){} }
    // لا نمسح المحلي اذا السحابة فاضية
    if(cloud.length>0 && cloud.length>=members.length){ members=cloud; saveLocal(); render(); }
    // رفع المحلي
    let content=btoa(unescape(encodeURIComponent(JSON.stringify(members))));
    let body={message:'update', content:content, branch:'main'}; if(sha) body.sha=sha;
    let c2=new AbortController(); setTimeout(()=>c2.abort(),4000);
    let r2=await fetch('https://api.github.com/repos/anoorhlby-coder/XFORCE/contents/data.json',{method:'PUT', headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}, body:JSON.stringify(body), signal:c2.signal});
    setStatus(r2.ok?'✅ متصل بالسحابة':'تم الحفظ محلياً ✅ - التوكن غلط او بدون صلاحية');
  }catch(e){ setStatus('تم الحفظ محلياً ✅ - تعذر الاتصال بالسحابة'); }
}
