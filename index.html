<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محفظة XFORCE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;color:#000;padding:15px}
.logo{text-align:center;font-size:55px;font-weight:900}
.logo span{color:#FF6B00}
.box{border:2px solid #FF6B00;border-radius:18px;padding:16px;margin:14px 0;text-align:center}
.big{text-align:center;font-size:50px;font-weight:900}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:12px;text-align:center;font-size:18px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin:5px 0}
.orange{background:#FF6B00;color:#fff}
.black{background:#000;color:#fff}
</style>
</head>
<body>
<div id="lock" class="box">
<div class="logo"><span>X</span>FORCE</div>
<h3 style="margin:12px 0">🔒 محفظة مقفولة</h3>
<input type="text" id="pass" placeholder="اكتب 0001">
<button class="btn orange" onclick="go()">دخول</button>
</div>
<div id="app" style="display:none">
<div class="logo"><span>X</span>FORCE</div>
<div class="box">
<h3>رصيد المحفظة</h3>
<div class="big" id="bal">$ 0</div>
<input type="number" id="amt" placeholder="المبلغ $">
<button class="btn orange" onclick="addM()">+ إضافة مصاري</button>
<button class="btn black" onclick="takeM()">- تخريج مصاري</button>
</div>
<button class="btn black" onclick="location.reload()">🚪 قفل المحفظة</button>
</div>
<script>
let bal = Number(localStorage.getItem('wallet_bal') || 0);
function showBal(){ document.getElementById('bal').innerText = '$ ' + bal; }
function go(){
let v = document.getElementById('pass').value;
v = v.trim();
if(v == '0001' || v == '٠٠٠١' || v == '۰001'){
document.getElementById('lock').style.display='none';
document.getElementById('app').style.display='block';
showBal();
} else { alert('كلمة السر غلط! اكتب 0001'); }
}
function addM(){ let x = Number(document.getElementById('amt').value); if(!x) return; bal += x; localStorage.setItem('wallet_bal', bal); document.getElementById('amt').value=''; showBal(); }
function takeM(){ let x = Number(document.getElementById('amt').value); if(!x) return; bal -= x; localStorage.setItem('wallet_bal', bal); document.getElementById('amt').value=''; showBal(); }
showBal();
</script>
</body>
</html>
