<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XFORCE</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff;color:#111;text-align:center}
header{padding:25px 10px 10px}
.logo{font-size:55px;font-weight:900;letter-spacing:1px}
.logo span{color:#ff6a00}
.logo b{color:#111}
.sub{color:#ff6a00;font-weight:700;margin-top:2px}
.card{background:#fff;border:2px solid #ff6a00;border-radius:20px;padding:20px;margin:20px 15px;box-shadow:0 5px 20px #ff6a0033}
.balance{font-size:38px;font-weight:900}
.balance small{font-size:16px;color:#666}
input{width:90%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:18px;text-align:center;margin:10px 0;outline:none}
input:focus{border-color:#ff6a00}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:18px;font-weight:800;margin-top:8px}
.add{background:#ff6a00;color:#fff}
.out{background:#111;color:#fff}
.history{text-align:right;padding:0 20px}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
.plus{color:green;font-weight:800}
.minus{color:red;font-weight:800}
</style>
</head>
<body>
<header>
<div class="logo"><span>X</span><b>FORCE</b></div>
<div class="sub">محفظتك - أبيض وبرتقاني</div>
</header>

<div class="card">
<div>رصيدك الحالي</div>
<div class="balance"><span id="bal">0</span> <small>ل.س</small></div>
<input id="amount" type="number" placeholder="اكتب المبلغ هون">
<button class="btn add" onclick="addMoney()">+ إضافة مبلغ</button>
<button class="btn out" onclick="outMoney()">- تخريج مبلغ</button>
</div>

<div class="history">
<h3>آخر الحركات</h3>
<div id="list">ما في حركات لسا</div>
</div>

<script>
let bal = Number(localStorage.getItem('x_bal')||0);
let hist = JSON.parse(localStorage.getItem('x_hist')||'[]');
function render(){
document.getElementById('bal').innerText=bal.toLocaleString();
let l=document.getElementById('list');
if(hist.length==0){l.innerHTML='ما في حركات لسا';return}
l.innerHTML=hist.slice().reverse().map(h=>`<div class="item"><span>${h.type}</span><b class="${h.type=='إضافة'? 'plus':'minus'}">${h.type=='إضافة'?'+':'-'} ${h.amt}</b></div>`).join('');
}
function addMoney(){
let v=Number(document.getElementById('amount').value);
if(!v) return alert('اكتب المبلغ أولاً');
bal+=v; hist.push({type:'إضافة',amt:v});
save();
}
function outMoney(){
let v=Number(document.getElementById('amount').value);
if(!v) return alert('اكتب المبلغ أولاً');
if(v>bal) return alert('رصيدك ما بيكفي');
bal-=v; hist.push({type:'تخريج',amt:v});
save();
}
function save(){
localStorage.setItem('x_bal',bal);
localStorage.setItem('x_hist',JSON.stringify(hist));
document.getElementById('amount').value='';
render();
}
render();
</script>
</body>
</html>
