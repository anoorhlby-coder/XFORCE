<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XFORCE - إدارة النادي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;color:#000;padding:15px}
.logo{text-align:center;font-size:55px;font-weight:900;line-height:1}
.logo span{color:#FF6B00}
.box{border:2px solid #FF6B00;border-radius:18px;padding:16px;margin:14px 0}
h3{text-align:center}
.big{text-align:center;font-size:48px;font-weight:900;margin:5px 0}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:12px;text-align:center;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:17px;margin:5px 0}
.orange{background:#FF6B00;color:#fff}
.black{background:#000;color:#fff}
.member{background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.del{background:#ff3333;color:#fff;border:none;padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<div class="logo"><span>X</span>FORCE</div>
<div class="box">
<h3>رصيدك الحالي</h3>
<div class="big" id="balance">$ 0</div>
<input type="number" id="amount" placeholder="المبلغ $">
<button class="btn orange" onclick="addMoney()">+ إضافة</button>
<button class="btn black" onclick="takeMoney()">- تخريج</button>
</div>
<div class="box">
<h3>👥 الأعضاء: <span id="count">0</span></h3>
<input type="text" id="name" placeholder="اسم العضو">
<select id="days"><option value="30">30 يوم - 20$</option><option value="90">90 يوم - 50$</option><option value="365">365 يوم - 180$</option></select>
<button class="btn orange" onclick="addMember()">+ إضافة عضو</button>
<input type="text" id="search" placeholder="🔍 ابحث عن عضو..." oninput="render()">
<div id="list"></div>
</div>
<script>
let balance = localStorage.getItem('xforce_balance') ? Number(localStorage.getItem('xforce_balance')) : 50;
let members = JSON.parse(localStorage.getItem('xforce_members') || '[]');
function save(){ localStorage.setItem('xforce_balance', balance); localStorage.setItem('xforce_members', JSON.stringify(members)); render(); }
function addMoney(){ let v = Number(document.getElementById('amount').value); if(!v) return alert('حط المبلغ'); balance+=v; document.getElementById('amount').value=''; save(); }
function takeMoney(){ let v = Number(document.getElementById('amount').value); if(!v) return alert('حط المبلغ'); balance-=v; document.getElementById('amount').value=''; save(); }
function addMember(){
let n=document.getElementById('name').value.trim(); if(!n) return alert('حط اسم العضو');
let d=Number(document.getElementById('days').value);
let price = d==30?20:d==90?50:180;
members.push({name:n, days:d, date:new Date().toLocaleDateString('ar-SY')});
balance+=price;
document.getElementById('name').value='';
save(); alert('تمت إضافة '+n+' ✅');
}
function delMember(i){ if(confirm('متأكد بدك تحذف؟')){ members.splice(i,1); save(); } }
  function render(){
document.getElementById('balance').innerText='$ '+balance;
document.getElementById('count').innerText=members.length;
let s=document.getElementById('search').value;
let html='';
members.forEach((m,i)=>{
if(s && !m.name.includes(s)) return;
html+=`<div class="member"><div><b>${m.name}</b><br><small>${m.days} يوم | ${m.date}</small></div><button class="del" onclick="delMember(${i})">حذف</button></div>`;
});
document.getElementById('list').innerHTML=html || '<p style="text-align:center;color:#999;margin:10px">ما في أعضاء</p>';
}
render();
</script>
</body>
</html>
