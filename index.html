<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XFORCE</title><style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:15px}h1{color:#ff7a00;font-size:46px;text-shadow:0 0 15px #ff7a00,0 0 35px #ff4d00}button{width:100%;padding:13px;border:0;border-radius:12px;background:#ff7a00;color:#fff;font-size:17px;font-weight:bold;margin:6px 0;box-shadow:0 0 18px #ff7a00}input{width:92%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #ff7a00;background:#1a1a1a;color:#fff}.card{background:#0d0d0d;border:1px solid #ff7a00;border-radius:18px;padding:15px;margin:12px 0}.member{background:#111;border:1px solid #ff7a00;border-radius:14px;padding:12px;margin:10px 0}.mrow{display:flex;gap:6px}.mrow button{font-size:14px;padding:9px}.g{background:#00c853;box-shadow:0 0 12px #00c853}.r{background:#d50000;box-shadow:0 0 12px #d50000}.b{background:#2962ff;box-shadow:0 0 12px #2962ff}.d{background:#333;box-shadow:none}</style></head><body><h1>XFORCE</h1><div>GYM • MEMBERSHIP • APP</div><div class="card"><div id="count"></div><input id="name" placeholder="اسم المشترك"><input id="money" type="number" placeholder="الرصيد $"><button onclick="addMember()">+ إضافة مشترك - 30 يوم</button><div id="status">جاهز ✅ نيون</div></div><div id="list"></div><div class="card"><button style="background:#222;box-shadow:none" onclick="exportData()">📥 تصدير نسخة احتياطية</button><input type="file" id="f" style="display:none" onchange="importData(event)"><button style="background:#222;box-shadow:none" onclick="document.getElementById('f').click()">📤 استيراد نسخة احتياطية</button></div><script>let members=[];try{members=JSON.parse(localStorage.getItem('xforce_members_v3')||'[]')}catch(e){}function save(){localStorage.setItem('xforce_members_v3',JSON.stringify(members))}function render(){document.getElementById('count').textContent=members.length+' مشترك';document.getElementById('list').innerHTML=members.map((m,i)=>`<div class="member"><b>${m.name}</b> - 💰 ${m.money}$<br>ينتهي ${m.end}<div class="mrow"><button class="g" onclick="addM(${i})">+ إضافة مصاري</button><button class="r" onclick="outM(${i})">- تخريج مصاري</button></div><div class="mrow"><button class="b" onclick="renew(${i})">🔁 تجديد 30 يوم</button><button class="d" onclick="delM(${i})">حذف</button></div></div>`).join('')||'لا يوجد مشتركين'}function addMember(){let n=document.getElementById('name').value.trim(),mo=Number(document.getElementById('money').value||0);if(!n){alert('اكتب الاسم');return}let d=new Date();d.setDate(d.getDate()+30);members.push({name:n,money:mo,end:d.toISOString().slice(0,10)});save();render();document.getElementById('name').value='';document.getElementById('money').value=''}function addM(i){let v=prompt('كم تضيف لـ '+members[i].name+'؟');if(v){members[i].money+=Number(v);save();render()}}function outM(i){let v=prompt('كم تخرج من '+members[i].name+'؟ رصيدو '+members[i].money);if(v){members[i].money-=Number(v);save();render()}}function renew(i){let d=new Date(members[i].end);d.setDate(d.getDate()+30);members[i].end=d.toISOString().slice(0,10);save();render()}function delM(i){if(confirm('حذف؟')){members.splice(i,1);save();render()}}function exportData(){let b=new Blob([JSON.stringify(members)]);let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='xforce-backup.json';a.click()}function importData(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{members=JSON.parse(r.result);save();render()};r.readAsText(f)}render();</script></body></html>
