<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>XFORCE</title><style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif}h1{color:#ff7a00;font-size:46px;text-shadow:0 0 15px #ff7a00}button{background:#ff7a00;color:#fff;padding:13px;width:100%;border:0;border-radius:12px;box-shadow:0 0 18px #ff7a00}input{width:92%;padding:12px;margin:6px;background:#222;color:#fff;border:1px solid #555;border-radius:10px}</style></head><body><h1>XFORCE</h1><div id="c"></div><input id="n" placeholder="اسم المشترك"><input id="m" type="number" placeholder="الرصيد $"><button onclick="a()">+ إضافة مشترك</button><div id="l"></div><script>let s=[];try{s=JSON.parse(localStorage.getItem('xforce_members_v3')||'[]')}catch(e){}function r(){document.getElementById('c').textContent=s.length+' مشترك';document.getElementById('l').innerHTML=s.map((x,i)=>`<p>${x.name} - ${x.money}$ - ${x.end} <button onclick="d(${i})">حذف</button></p>`).join('')}function a(){let n=document.getElementById('n').value;if(!n)return;let d=new Date();d.setDate(d.getDate()+30);s.push({name:n,money:document.getElementById('m').value||0,end:d.toISOString().slice(0,10)});localStorage.setItem('xforce_members_v3',JSON.stringify(s));r()}function d(i){s.splice(i,1);localStorage.setItem('xforce_members_v3',JSON.stringify(s));r()}r();</script></body></html>
